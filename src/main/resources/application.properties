spring.application.name=project-backend
server.port=8282

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/qmcms_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JACKSON
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO

# ===============================
# JWT
# ===============================
jwt.secret=YourVeryLongSecretKeyForJwtAuthenticationThatIsAtLeast32CharactersLong
jwt.expiration=86400000

#=================================
# IMAGE UPLOAD
#=================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB